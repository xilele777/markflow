name: Deploy (disabled until server is ready)

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: lingshu-production
  cancel-in-progress: false

jobs:
  prepare:
    # 保持未设置/false。只有服务器验收准备完成后才启用；PR、失败 CI 不触发。
    if: >-
      vars.LINGSHU_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    env:
      WEB_REPOSITORY: ${{ vars.LINGSHU_WEB_REPOSITORY }}
      WEB_SHA: ${{ vars.LINGSHU_WEB_SHA }}
      RELEASE: release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Validate paired frontend revision
        run: |
          [[ "$WEB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$WEB_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          path: server
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.LINGSHU_WEB_REPOSITORY }}
          ref: ${{ vars.LINGSHU_WEB_SHA }}
          token: ${{ secrets.LINGSHU_WEB_READ_TOKEN || github.token }}
          path: web
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Backend checks on the exact revision
        working-directory: server
        run: |
          npm ci
          npm run lint
          npx prettier --check src tests
          npm run typecheck
          bash -n scripts/activate.sh scripts/smoke.sh scripts/backup-pg.sh scripts/test-activate.sh
          shellcheck scripts/activate.sh scripts/smoke.sh scripts/backup-pg.sh scripts/test-activate.sh
          bash scripts/test-activate.sh
          cp .env.example .env
          npm run infra:up
          npm test
          npm run build
      - name: Frontend checks on the pinned revision
        working-directory: web
        run: |
          npm ci
          npx eslint . --max-warnings 100
          npm run typecheck
          npm test
          npm run build:check
      - name: Assemble paired immutable release
        working-directory: server
        run: |
          node scripts/package-release.mjs ../web ./artifacts "$RELEASE"
          tar -C artifacts -czf "$RELEASE.tar.gz" "$RELEASE"
          sha256sum "$RELEASE.tar.gz" > "$RELEASE.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            server/release-*.tar.gz
            server/release-*.tar.gz.sha256
          retention-days: 14
      - name: Stop disposable CI infrastructure
        if: always()
        working-directory: server
        run: |
          if [[ -f .env ]]; then npm run infra:down; fi

  activate:
    needs: [prepare]
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE: release-${{ github.run_id }}-${{ github.run_attempt }}
      DEPLOY_HOST: ${{ secrets.LINGSHU_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.LINGSHU_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.LINGSHU_DEPLOY_PORT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Install pinned SSH credentials
        env:
          SSH_KEY: ${{ secrets.LINGSHU_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.LINGSHU_DEPLOY_KNOWN_HOSTS }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload, verify checksum, activate with automatic rollback
        working-directory: release
        run: |
          sha256sum -c "$RELEASE.tar.gz.sha256"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /srv/lingshu/incoming /srv/lingshu/releases'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$DEPLOY_PORT" "$RELEASE.tar.gz" "$RELEASE.tar.gz.sha256" "$DEPLOY_USER@$DEPLOY_HOST:/srv/lingshu/incoming/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; cd /srv/lingshu/incoming; sha256sum -c '$RELEASE.tar.gz.sha256'; test ! -e '/srv/lingshu/releases/$RELEASE'; tar --no-same-owner -xzf '$RELEASE.tar.gz' -C /srv/lingshu/releases; bash '/srv/lingshu/releases/$RELEASE/scripts/activate.sh' '$RELEASE'"
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
