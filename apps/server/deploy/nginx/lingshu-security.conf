# Nginx location 定义 add_header 后不继承父级，因此静态 location 也显式 include。
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
add_header Strict-Transport-Security 'max-age=31536000' always;
# AntD/Puck 使用内联 style；connect-src 必须换成实际浏览器直传 S3 的 HTTPS origin。
# 外链标注工具使用 iframe，按实际工具域名收紧 frame-src。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://objects.example.com; frame-src https:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
