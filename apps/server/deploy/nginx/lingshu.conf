# 模板：替换 app.example.com、证书路径及 /srv/lingshu；放在 /etc/nginx/conf.d/。
# 首次上线使用独立候选域名，验收后再切业务域名。勿覆盖 LabelHub 的现有 server。
server {
    listen 80;
    server_name app.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.example.com;
    ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/lingshu/current/web;
    index index.html;
    client_max_body_size 2m;
    include /etc/nginx/snippets/lingshu-security.conf;

    # Prometheus 在本机直连 8080 + Bearer token，不通过公网域名。
    location ~* ^/api/metrics(?:/|$) { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /index.html {
        include /etc/nginx/snippets/lingshu-security.conf;
        add_header Cache-Control 'no-cache' always;
    }
    location = /release.json {
        include /etc/nginx/snippets/lingshu-security.conf;
        add_header Cache-Control 'no-cache' always;
        try_files $uri =404;
    }
    location /assets/ {
        include /etc/nginx/snippets/lingshu-security.conf;
        add_header Cache-Control 'public, max-age=31536000, immutable';
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
