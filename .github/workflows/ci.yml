name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-packaging:
    name: Monorepo release packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:release

  server-scripts:
    name: Deployment scripts (local fixtures only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/activate.sh scripts/smoke.sh scripts/backup-pg.sh scripts/test-activate.sh
      - run: shellcheck scripts/activate.sh scripts/smoke.sh scripts/backup-pg.sh scripts/test-activate.sh
      - run: bash scripts/test-activate.sh
  server-lint:
    name: Lint / Format / Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check src tests
      - run: npm run typecheck

  server-test:
    name: Integration Tests (pg / redis / minio)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    needs: [server-lint]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markflow
          POSTGRES_PASSWORD: ci_pg_pwd
          POSTGRES_DB: markflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U markflow -d markflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MARKFLOW_PG_HOST: 127.0.0.1
      MARKFLOW_PG_PORT: '5432'
      MARKFLOW_PG_DB: markflow_test
      MARKFLOW_TEST_PG_DB: markflow_test
      MARKFLOW_PG_USER: markflow
      MARKFLOW_PG_PASSWORD: ci_pg_pwd
      MARKFLOW_REDIS_HOST: 127.0.0.1
      MARKFLOW_REDIS_PORT: '6379'
      MARKFLOW_REDIS_PASSWORD: ci_redis_pwd
      MARKFLOW_S3_ENDPOINT: http://127.0.0.1:9000
      MARKFLOW_S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      MARKFLOW_S3_REGION: us-east-1
      MARKFLOW_S3_BUCKET: markflow
      MARKFLOW_S3_ACCESS_KEY: ci-minio
      MARKFLOW_S3_SECRET_KEY: ci_minio_pwd
      MARKFLOW_S3_FORCE_PATH_STYLE: 'true'
      MARKFLOW_CORS_ALLOWED_ORIGINS: http://localhost:5173
      MARKFLOW_CONFIG_ENC_KEY: ci-only-config-enc-key-0123456789abcdef0123456789
      MARKFLOW_JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      # MinIO 需要自定义启动命令，GitHub services 不支持，故用容器手动起。
      - name: Configure Redis password
        run: docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET requirepass ci_redis_pwd
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-minio -e MINIO_ROOT_PASSWORD=ci_minio_pwd \
            quay.io/minio/minio:latest server /data
          for _attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9000/minio/health/live
          docker run --rm --network host --entrypoint /bin/sh quay.io/minio/mc:latest -c \
            "mc alias set local http://127.0.0.1:9000 ci-minio ci_minio_pwd && mc mb --ignore-existing local/markflow"
      - run: npm ci
      - run: npm test

  server-build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    needs: [server-lint, server-test, server-scripts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: |
            apps/server/dist/
            apps/server/package.json
            apps/server/package-lock.json
          retention-days: 7

  web-lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: ESLint（错误即失败，警告上限 100）
        run: npx eslint . --max-warnings 100
      - name: TypeScript
        run: npm run typecheck

  web-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test

  web-build:
    name: Build & Bundle Budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    needs: [web-lint, web-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Bundle size budget
        run: node scripts/check-bundle-size.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7
